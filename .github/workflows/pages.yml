name: Storybook

# Publishes the Storybook to GitHub Pages. release.yml calls this after each release, so the site shows the latest
# released version. Run it by hand (Actions > Storybook > Run workflow) to republish.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling one that is half done
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
